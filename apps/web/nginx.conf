server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicación es una SPA: el enrutamiento lo maneja React Router en el
    # cliente. Si alguien entra directo a /dashboard, nginx no encuentra ese
    # archivo y debe devolver index.html para que React resuelva la ruta.
    # Sin esto, recargar cualquier página que no sea la raíz da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre pueden cachearse de forma agresiva:
    # si el contenido cambia, cambia el nombre del archivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es el que apunta a las versiones actuales
    # de los assets. Si se cachea, el usuario queda con una versión vieja.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
